<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Connect early to what every page needs (reCAPTCHA → App Check →
         Firestore / functions / sign-in). -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://content-firebaseappcheck.googleapis.com" />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://europe-west1-quality-toolsx.cloudfunctions.net" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>HyperCBT</title>
    <meta name="description" content="Create, run and mark computer-based tests - by Quality Tools." />
    <meta property="og:site_name" content="HyperCBT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HyperCBT" />
    <meta property="og:description" content="Create, run and mark computer-based tests - by Quality Tools." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Apply a saved theme before first paint so there's no light→dark flash.
      // No saved choice = follow the system (handled in CSS).
      try {
        const theme = localStorage.getItem('hypercbt-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
      } catch {
        // Storage blocked (private mode etc.) - system theme still applies.
      }
    </script>
  </head>
  <body>
    <!-- The loading ring (src/lib/Spinner.jsx) while the app downloads; React
         replaces it on start. Styles inline because the CSS isn't loaded yet. -->
    <div id="root">
      <div class="boot-spinner" role="status" aria-label="Loading">
        <svg width="40" height="40" viewBox="0 0 50 50" aria-hidden="true">
          <circle cx="25" cy="25" r="20" fill="none" stroke-width="4.5" stroke-linecap="round" />
        </svg>
      </div>
    </div>
    <style>
      .boot-spinner { display: grid; place-items: center; min-height: 100dvh; color: #a9b8c3; }
      [data-theme='dark'] .boot-spinner { color: #5f6e7a; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot-spinner { color: #5f6e7a; } }
      .boot-spinner svg { animation: boot-turn 1.4s linear infinite; }
      .boot-spinner circle { stroke: currentColor; stroke-dasharray: 1 150; animation: boot-arc 1.4s ease-in-out infinite; }
      @keyframes boot-turn { to { transform: rotate(360deg); } }
      @keyframes boot-arc {
        0% { stroke-dasharray: 1 150; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90 150; stroke-dashoffset: -35; }
        100% { stroke-dasharray: 90 150; stroke-dashoffset: -124; }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
